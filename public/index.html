<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Recipe Book</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script>window.RECIPE_BOOK_STATIC = false;</script>
<header class="site-header">
  <div class="header-actions">
    <select id="random-meal-type" class="meal-type-select sort-select" aria-label="Filter (and randomize) by meal type">
      <option value="">Any meal type</option>
    </select>
    <button type="button" id="random-btn" class="btn btn-primary btn-small">🎲 Random</button>
    <a href="dashboard.html" class="btn btn-primary btn-small">📊 Dashboard</a>
    <button type="button" id="refresh-live-btn" class="btn btn-primary btn-small" hidden>🚀 Refresh Live Site</button>
  </div>
  <h1>My Recipe Book</h1>
  <p id="tagline" class="tagline">Recipes captured from around the web, cleaned up and ready to cook from.</p>
</header>
<main>
  <section id="dashboard" class="dashboard" hidden>
    <div id="active-filter-banner" class="active-filter-banner" hidden></div>

    <div class="dashboard-controls">
      <input
        id="ingredient-search"
        type="search"
        class="search-input"
        placeholder="Search recipes (name, tags, ingredients)…"
        aria-label="Search recipes by name, tag, or ingredient"
      />
      <select id="meal-type-filter" class="meal-type-select sort-select" aria-label="Filter by meal type">
        <option value="">Any meal type</option>
      </select>
      <select id="sort-select" class="sort-select" aria-label="Sort recipes">
        <option value="newest">Newest first</option>
        <option value="calories-asc">Calories: low to high</option>
        <option value="calories-desc">Calories: high to low</option>
      </select>
    </div>

    <details id="tag-filter-details" class="tag-filter-details" hidden>
      <summary class="tag-filter-summary">Search by Tags</summary>
      <div id="tag-filter" class="tag-filter" role="group" aria-label="Filter by tags (select multiple)"></div>
    </details>
  </section>

  <p id="empty-state" class="empty-state" hidden>
    No recipes yet. Browse to a recipe online, click the Recipe Book extension icon, and it'll show up here.
  </p>
  <div id="recipe-grid" class="grid"></div>
</main>
<script src="app.js"></script>
<script src="stats.js"></script>
<script src="book.js"></script>
</body>
</html>
