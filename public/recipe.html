<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe — My Recipe Book</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="env-local">
<script>window.RECIPE_BOOK_STATIC = false;</script>
<header class="site-header slim">
  <a class="back-link" href="index.html">&larr; My Recipe Book</a>
</header>
<main id="recipe" class="recipe-detail">
  <div class="recipe-top">
    <div class="recipe-media-row">
      <img id="hero-image" alt="" hidden />
      <div class="made-panel">
        <button id="mark-made-btn" class="btn btn-primary btn-small">Mark as made today</button>
        <details id="made-history" class="made-history" hidden>
          <summary id="made-history-summary">Cooking History</summary>
          <p id="made-static-note" class="made-note" hidden>
            Tracked locally in your browser for you only
          </p>
          <ul id="made-dates" class="made-dates"></ul>
        </details>
      </div>
    </div>
    <div class="recipe-heading">
      <h1 id="title"></h1>
      <div id="tags" class="tag-row"></div>
      <a id="source-link" class="source-link" target="_blank" rel="noopener" hidden></a>
      <button id="edit-btn" class="btn btn-small edit-btn" type="button" hidden>Edit recipe</button>
    </div>
  </div>
  <div id="edit-bar" class="edit-bar" role="toolbar" aria-label="Recipe editor" hidden>
    <div class="edit-bar-main">
      <button id="save-edit-btn" class="btn btn-primary btn-small" type="button">Save changes</button>
      <button id="cancel-edit-btn" class="btn btn-small btn-ghost" type="button">Cancel</button>
      <button id="measure-btn" class="btn btn-small btn-ghost" type="button" title="Select text in a step, then click to highlight (or un-highlight) it as a measurement">Highlight as measurement</button>
    </div>
    <p id="edit-status" class="edit-status" role="status"></p>
  </div>
  <p id="rewrite-warning" class="warning" hidden></p>
  <div class="recipe-columns">
    <section class="ingredients-panel">
      <div class="panel-header">
        <h2>Ingredients</h2>
      </div>
      <div class="control-row">
        <div id="system-controls" class="scale-controls" role="group" aria-label="Measurement system">
          <button type="button" class="scale-btn" data-system="us">US</button>
          <button type="button" class="scale-btn" data-system="metric">Metric</button>
        </div>
        <div id="scale-controls" class="scale-controls" role="group" aria-label="Scale recipe">
          <button type="button" class="scale-btn" data-multiplier="1">1x</button>
          <button type="button" class="scale-btn" data-multiplier="2">2x</button>
          <button type="button" class="scale-btn" data-multiplier="3">3x</button>
          <button type="button" class="scale-btn" data-multiplier="4">4x</button>
        </div>
      </div>
      <ul id="ingredients"></ul>
      <button id="add-ingredient-btn" class="edit-add edit-only" type="button">+ Add ingredient</button>
      <button id="keep-btn" class="btn btn-primary btn-block">Copy &amp; Open Google Keep</button>
    </section>
    <section class="instructions-panel">
      <h2>Instructions</h2>
      <ol id="instructions"></ol>
      <button id="add-step-btn" class="edit-add edit-only" type="button">+ Add step</button>
      <p class="edit-hint edit-only">Highlighted text is a measurement. Select text in a step and click "Highlight as measurement" to add or remove one. Press Enter for a new line.</p>
    </section>
  </div>
  <button id="delete-btn" class="btn btn-danger">Remove recipe</button>
</main>
<script src="app.js"></script>
<script src="units.js"></script>
<script src="stats.js"></script>
<script src="recipe.js"></script>
</body>
</html>
