<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Recipe Book</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script>window.RECIPE_BOOK_STATIC = true;</script>
<header class="site-header">
  <h1>My Recipe Book</h1>
  <p id="tagline" class="tagline">Recipes captured from around the web, cleaned up and ready to cook from.</p>
</header>
<main>
  <div id="tag-filter" class="tag-filter" role="group" aria-label="Filter by tag" hidden></div>
  <p id="empty-state" class="empty-state" hidden>
    No recipes yet. Browse to a recipe online, click the Recipe Book extension icon, and it'll show up here.
  </p>
  <div id="recipe-grid" class="grid"></div>
</main>
<script src="app.js"></script>
<script src="book.js"></script>
</body>
</html>
