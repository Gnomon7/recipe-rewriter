<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipe — My Recipe Book</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<script>window.RECIPE_BOOK_STATIC = true;</script>
<header class="site-header slim">
  <a class="back-link" href="index.html">&larr; My Recipe Book</a>
</header>
<main id="recipe" class="recipe-detail">
  <div class="recipe-top">
    <img id="hero-image" alt="" hidden />
    <div class="recipe-heading">
      <h1 id="title"></h1>
      <div id="tags" class="tag-row"></div>
      <a id="source-link" class="source-link" target="_blank" rel="noopener" hidden></a>
    </div>
  </div>
  <p id="rewrite-warning" class="warning" hidden></p>
  <div class="recipe-columns">
    <section class="ingredients-panel">
      <div class="panel-header">
        <h2>Ingredients</h2>
      </div>
      <div class="control-row">
        <div id="system-controls" class="scale-controls" role="group" aria-label="Measurement system">
          <button type="button" class="scale-btn" data-system="us">US</button>
          <button type="button" class="scale-btn" data-system="metric">Metric</button>
        </div>
        <div id="scale-controls" class="scale-controls" role="group" aria-label="Scale recipe">
          <button type="button" class="scale-btn" data-multiplier="1">1x</button>
          <button type="button" class="scale-btn" data-multiplier="2">2x</button>
          <button type="button" class="scale-btn" data-multiplier="3">3x</button>
          <button type="button" class="scale-btn" data-multiplier="4">4x</button>
        </div>
      </div>
      <ul id="ingredients"></ul>
      <button id="keep-btn" class="btn btn-primary btn-block">Copy &amp; Open Google Keep</button>
    </section>
    <section class="instructions-panel">
      <h2>Instructions</h2>
      <ol id="instructions"></ol>
    </section>
  </div>
  <button id="delete-btn" class="btn btn-danger">Remove recipe</button>
</main>
<script src="app.js"></script>
<script src="units.js"></script>
<script src="recipe.js"></script>
</body>
</html>
